async function shareImg(){
const ym=S.cur,m=ensure(ym),c=calc(m,ym);
const rows=m.items.filter(i=>i.t!=='y'&&(i.name||effAmt(i,ym))).map(i=>[(i.name||'')+(i.wk?' ×'+weekCount(i,ym)+'주':''),effAmt(i,ym)]);
const W=720,P=36,RH=58,top=[['월급',fmt(c.sal)],['용돈 비율',(effRat(ym)*100).toFixed(2).replace(/\.?0+$/,'')+'%'],['용돈 (월급×비율)',fmt(c.y0)],['송금 반올림 조정',sgn(c.adj)],['용돈 (최종)',fmt(c.yong)]];
const H=P+70+190+P+top.length*RH+P+60+rows.length*RH+RH+P+10;
const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
const F='-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
x.fillStyle='#10131a';x.fillRect(0,0,W,H);
const card=(y,h)=>{x.fillStyle='#1b212c';x.beginPath();x.roundRect(P/2,y,W-P,h,24);x.fill();x.strokeStyle='#2c3444';x.lineWidth=2;x.stroke()};
const row=(y,k,v,b)=>{x.font=(b?'700 ':'400 ')+'28px '+F;x.textAlign='left';x.fillStyle=b?'#fff':'#9aa3b5';x.fillText(k,P+10,y);x.textAlign='right';x.fillStyle='#fff';x.font='700 28px '+F;x.fillText(v,W-P-10,y)};
let y=P;x.fillStyle='#fff';x.font='700 44px '+F;x.textAlign='center';x.fillText(ymLabel(ym),W/2,y+44);y+=70;
card(y,190);x.font='400 26px '+F;x.fillStyle='#9aa3b5';x.fillText('송금할 돈',W/2,y+50);x.font='700 76px '+F;x.fillStyle=c.send<0?'#e8806f':'#6cc08f';x.fillText(fmt(c.send),W/2,y+140);y+=190+P/2;
card(y,top.length*RH+30);let yy=y+55;top.forEach(r=>{row(yy,r[0],r[1]);yy+=RH});y+=top.length*RH+30+P/2;
card(y,60+rows.length*RH+RH);yy=y+50;x.textAlign='left';x.font='700 28px '+F;x.fillStyle='#fff';x.fillText('지출 항목 (월급)',P+10,yy);yy+=RH;
rows.forEach(r=>{row(yy,r[0],fmt(r[1]));yy+=RH});row(yy,'지출 합계 (월급)',fmt(c.wsum),1);
const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const f=new File([blob],'월급출납장_'+ym+'.png',{type:'image/png'});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}
const u=URL.createObjectURL(blob),o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;overflow:auto;padding:12px;text-align:center;color:#fff;font-size:14px';o.innerHTML='<p>이미지를 길게 눌러 저장/공유하세요 (화면을 탭하면 닫힘)</p><img src="'+u+'" style="width:100%;max-width:480px">';o.onclick=()=>o.remove();document.body.appendChild(o)}
let openOut=false,openBw=false,openBal=false;function tgBal(){openBal=!openBal;$('#bald').classList.toggle('o',openBal);$('#car3').textContent=openBal?'▾':'▸'}function tgBw(){openBw=!openBw;$('#bwd').classList.toggle('o',openBw);$('#car2').textContent=openBw?'▾':'▸'}
function tgOut(){openOut=!openOut;$('#outd').classList.toggle('o',openOut);sum()}
function fit(){document.querySelectorAll('.fit').forEach(e=>{let z=14;e.style.fontSize=z+'px';while(e.scrollWidth>e.clientWidth&&z>7){z-=.5;e.style.fontSize=z+'px'}})}
function sum(){const ym=S.cur,m=S.months[ym],c=calc(m,ym);
const set=(id,t,cls)=>{const e=$('#'+id);if(!e)return;e.textContent=t;if(cls!==undefined)e.className=cls};
set('vbal',fmt(c.send),'v '+(c.send<0?'neg':'pos'));
set('vbw',(c.bw>=0?'흑자 ':'적자 ')+sgn(c.bw)+'원 (입출금통장−나가는돈)');
set('snote',(m.salary==null?'월급 '+fmt(c.sal)+'원':'')+(m.salary==null&&m.ratio==null?' · ':'')+(m.ratio==null?'비율 '+(effRat(ym)*100).toFixed(2).replace(/\.?0+$/,'')+'%':'')+((m.salary==null||m.ratio==null)?' 지난달 값 자동 적용 중 · 직접 입력하면 입력값이 우선':''));set('y0',fmt(c.y0));set('ysA',fmt(c.ysA));set('wsum',fmt(c.wsum));set('ysr',sgn(-c.ysA));set('left',sgn(c.left),c.left<0?'neg':'');set('adj',sgn(-c.adj));set('yong',fmt(c.yong));set('isum',fmt(c.isum));
set('car',openOut?'▾':'▸');set('car2',openBw?'▾':'▸');set('car3',openBal?'▾':'▸');{const L=(k,v)=>`<div class="l"><span>${k}</span><span>${v}</span></div>`;const e=$('#outdet');if(e)e.innerHTML=L('카드합계','+'+fmt(c.card))+L('지출분류','+'+fmt(c.other))+L('지출합계','+'+fmt(c.isum))+L('카드체크','−'+fmt(c.csum))}set('card',fmt(c.card));{const d=c.csum-c.card,r=$('#cdr');if(r){r.style.display=d?'flex':'none';set('cdl','카드체크 항목 합 '+fmt(c.csum)+'원 · 차이(항목합−카드합계)');set('cdv',sgn(d))}}set('out',fmt(c.out));
set('onote',m.other==null?'지난달 값 '+fmt(c.other)+'원 자동 적용 중 · 직접 입력하면 입력값이 우선':'직접 입력한 값 · 지우면 지난달 값을 사용');
set('sum',fmt(c.sum));set('bal',sgn(c.send));set('bw',(c.bw>=0?'흑자 ':'적자 ')+sgn(c.bw),c.bw<0?'neg':'pos')}
function itemHtml(it,i){return `<div class="it">
<input type="date" value="${it.date||''}" onchange="upd(${i},'date',this.value)">
<input value="${esc(it.name)}" placeholder="항목" onchange="upd(${i},'name',this.value)">
<input inputmode="numeric" value="${it.amount?fmt(it.amount):''}" placeholder="금액" oninput="ia(this,${i})">
<button class="x" onclick="del(${i})">✕</button></div>
<label class="pin"><input type="checkbox" ${it.fixed?'checked':''} onchange="upd(${i},'fixed',this.checked)"> 고정항목<input type="checkbox" style="margin-left:8px" ${it.card?'checked':''} onchange="upd(${i},'card',this.checked)"> 카드<input type="checkbox" style="margin-left:8px" ${it.wk?'checked':''} onchange="upd(${i},'wk',this.checked)"> 일주일반복<button class="sg" onclick="neg(${i})">± 부호</button></label><div class="note wk" id="wk${i}">${wkText(it)}</div>`}
function drawItems(){const m=S.months[S.cur];
const L=t=>{const a=m.items.map((it,i)=>[it,i]).filter(([it])=>(it.t==='y')===(t==='y'));return a.length?a.map(([it,i])=>itemHtml(it,i)).join(''):'<div class="note">항목이 없습니다.</div>'};
$('#items').innerHTML=L('w');$('#itemsY').innerHTML=L('y')}
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function wkr(i){const e=$('#wk'+i);if(e)e.textContent=wkText(S.months[S.cur].items[i])}
function upd(i,k,v){S.months[S.cur].items[i][k]=v;save();wkr(i);sum()}
function ia(el,i){S.months[S.cur].items[i].amount=fmtIn(el)||0;save();wkr(i);sum()}
function neg(i){const it=S.months[S.cur].items[i];it.amount=-(it.amount||0);save();drawItems();sum()}
function addItem(t){S.months[S.cur].items.push({date:'',name:'',amount:0,fixed:false,t:t||'w'});save();drawItems();sum()}
function del(i){if(!confirm('이 항목을 삭제할까요?'))return;S.months[S.cur].items.splice(i,1);save();drawItems();sum()}
function copyFixed(t){t=t||'w';const m=S.months[S.cur],p=S.months[lastBefore(S.cur)];if(!p)return alert('이전 달 기록이 없습니다.');
let n=0;p.items.filter(i=>i.fixed&&(i.t||'w')===t).forEach(i=>{if(!m.items.some(x=>x.name===i.name&&x.fixed&&(x.t||'w')===t)){m.items.push({...i,date:''});n++}});
save();drawItems();sum();alert(n+'개 항목을 불러왔습니다.')}
function go(k){S.cur=shift(S.cur,k);save();ensure(S.cur);render()}
function pick(){const v=prompt('이동할 연월 (예: 2026-11)',S.cur);if(v&&/^\d{4}-\d{1,2}$/.test(v)){const[y,m]=v.split('-');S.cur=y+'-'+m.padStart(2,'0');ensure(S.cur);save();render()}}
function rList(){
const keys=Object.keys(S.months).filter(incl).sort().reverse();
let tot=0;
const rows=keys.map(k=>{const c=calc(S.months[k],k);tot+=c.send;return`<div class="lst" onclick="S.cur='${k}';save();setTab('in')"><b>${k.slice(2).replace('-','.')}</b><span class="r">${fmt(c.sal)}</span><span class="r">${fmt(c.sum)}</span><span class="r ${c.send<0?'neg':'pos'}">${sgn(c.send)}</span></div>`}).join('');
$('#app').innerHTML=`<div class="card big"><div class="l">기록된 ${keys.length}개월 송금할 돈 누계</div><div class="v ${tot<0?'neg':'pos'}">${sgn(tot)}</div></div>
<div class="lst h"><span>연.월</span><span class="r">월급</span><span class="r">합계</span><span class="r">송금할 돈</span></div>${rows}
<div class="note">행을 누르면 해당 월로 이동합니다. 송금할 돈 = 월급 − 용돈 − 월급지출합계, 만원 단위 반올림</div>`}
function rYear(){
const Y={};Object.keys(S.months).forEach(k=>{const m=S.months[k];if(!incl(k))return;const y=k.slice(0,4),c=calc(m,k);
const o=Y[y]=Y[y]||{n:0,sal:0,yong:0,sum:0,send:0,bw:0};o.n++;o.sal+=c.sal;o.yong+=c.yong;o.sum+=c.sum;o.send+=c.send;o.bw+=c.bw});
const ys=Object.keys(Y).sort().reverse();const mx=Math.max(1,...ys.map(y=>Y[y].sal));
$('#app').innerHTML=ys.map(y=>{const o=Y[y];return`<div class="card"><b>${y}년</b> <span class="note">${o.n}개월 기록</span>
<div class="bar" style="margin:8px 0"><i style="width:${o.sal/mx*100}%"></i></div>
<div class="row"><span class="k">월급 합계</span><b>${fmt(o.sal)}</b></div>
<div class="row"><span class="k">용돈 합계</span><b>${fmt(o.yong)}</b></div>
<div class="row"><span class="k">합계(용돈+월급지출합계)</span><b>${fmt(o.sum)}</b></div>
<div class="row"><span class="k">송금할 돈 합계</span><b class="${o.send<0?'neg':'pos'}">${sgn(o.send)}</b></div>
<div class="row"><span class="k">흑자/적자 합계</span><b class="${o.bw<0?'neg':'pos'}">${sgn(o.bw)}</b></div>
<div class="row"><span class="k">월평균 합계</span><b>${fmt(o.sum/o.n)}</b></div></div>`}).join('')}
function rSet(){
$('#app').innerHTML=`<div class="card"><b>백업 · 복원</b>
<div class="note">기록은 이 기기(Safari)에만 저장됩니다. 주기적으로 백업 파일을 저장해 두세요.</div>
<button class="p" onclick="exp()">백업 파일 저장(JSON)</button>
<button class="s" style="margin-top:8px" onclick="document.getElementById('fi').click()">백업 파일 불러오기</button>
<input id="fi" type="file" accept=".json,application/json" style="display:none" onchange="imp(this)">
<button class="s" onclick="rst()">원본 기록으로 되돌리기</button></div>
<div class="card"><b>계산 방식</b><div class="note">용돈 = 월급 × 비율(기본 10%), 용돈 항목은 용돈에서 차감(남은 용돈)하되 지출합계에는 월급 항목과 함께 포함<br>송금할 돈 = 월급 − 용돈 − 월급지출합계, 만원 단위 반올림(5천원 이상 올림)<br>반올림으로 늘거나 줄어든 금액은 용돈에서 가감<br>합계 = 용돈(반올림 반영) + 월급 지출합계 (= 최종 용돈 + 지출 합계(월급+용돈))<br>일주일반복 체크 항목은 금액 × 이번 달 반복 횟수로 계산<br>나가는돈 = 카드합계 + 지출분류 + 지출합계 − 카드체크<br>카드체크 항목 합이 실제 카드금액과 다르면 카드합계 아래에 차이를 표시<br>지출분류: 직접 입력이 우선, 없으면 지난달 값 사용<br>흑자/적자 = 입출금통장 − 나가는돈</div></div>`}
function exp(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='월급출납장_백업_'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.months)throw 0;if(!confirm('현재 기록을 이 백업으로 덮어쓸까요?'))return;S=mig(d);save();alert('불러왔습니다.');render()}catch(e){alert('올바른 백업 파일이 아닙니다.')}};r.readAsText(f)}
function rst(){if(!confirm('모든 기록을 원본(2026년 9월까지)으로 되돌립니다. 입력한 새 기록은 사라집니다.'))return;S={months:seed(),cur:ymNow(),v:5};save();render()}
load();ensure(S.cur);save();render();</script></body></html>
