<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스테이지 분석기</title>
<meta name="theme-color" content="#18211c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스테이지">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 한 칼럼. 종목 목록에서 상세로 들어가는 구조, 시장 단계는 항상 상단에 표시 */
:root{
  --bg:#f3f4f0; --surface:#ffffff; --ink:#17221d; --muted:#5f6b64; --line:#dfe3dc;
  --accent:#1f3a5f; --accent-ink:#ffffff; --ma:#b45309;
  --s1:#6b7a99; --s2:#1f8a5b; --s3:#c98a12; --s4:#c2412d;
  --font-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-display:'Noto Serif KR','Batang',serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1512; --surface:#18201c; --ink:#e8eee9; --muted:#97a59c; --line:#2a3530;
    --accent:#9db8e8; --accent-ink:#0f1512; --ma:#f5a524;
    --s1:#8d9bb8; --s2:#3ec28a; --s3:#e8b040; --s4:#ef6a55;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18201c; --ink:#e8eee9; --muted:#97a59c; --line:#2a3530;
  --accent:#9db8e8; --accent-ink:#0f1512; --ma:#f5a524;
  --s1:#8d9bb8; --s2:#3ec28a; --s3:#e8b040; --s4:#ef6a55;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* 상단 */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.mkt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px 6px 8px;display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.mkt .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;font-family:var(--font-mono)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:4px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;min-height:44px;font-weight:500;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}

/* 색 */
.s1{--c:var(--s1)} .s2{--c:var(--s2)} .s3{--c:var(--s3)} .s4{--c:var(--s4)}
.sig.buy{--c:var(--s2)} .sig.watch{--c:var(--accent)} .sig.hold{--c:var(--s2)} .sig.hot{--c:var(--s3)}
.sig.wait{--c:var(--s1)} .sig.reduce{--c:var(--s3)} .sig.avoid{--c:var(--s4)}
.sig{display:inline-block;border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:700;white-space:nowrap}
.sig.buy{background:var(--c);color:#fff}

/* 버튼 */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;min-height:44px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--s4)}
.btn.small{min-height:36px;padding:6px 10px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}

/* 목록 */
.summary{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;font-size:13px;color:var(--muted)}
.summary span{display:inline-flex;align-items:center;gap:6px}
.summary i{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 12px}
.row:hover{border-color:var(--c)}
.badge{width:36px;height:36px;border-radius:8px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--font-mono);font-weight:500;font-size:17px}
.row .name{font-weight:700;display:block}
.row .sub{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.row .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row svg{display:block}
.tag{font-size:11px;border:1px dashed var(--muted);color:var(--muted);border-radius:4px;padding:0 5px;margin-left:6px;font-weight:500;vertical-align:middle}

/* 상세 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;border-left:6px solid var(--c)}
.hero .big{font-family:var(--font-display);font-weight:800;font-size:56px;line-height:1;color:var(--c);min-width:54px;text-align:center}
.hero .big small{display:block;font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--muted);margin-top:4px}
.hero h2{font-size:19px;margin-bottom:4px}
.hero p{margin:6px 0 0;color:var(--muted);font-size:14px}
.chartwrap{position:relative}
canvas{display:block;width:100%;touch-action:pan-y}
#c-main{height:320px}
#c-rs{height:120px}
.tip{position:absolute;left:8px;top:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;pointer-events:none;display:none;font-family:var(--font-mono)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;background:var(--c)}
.legend i.box{height:10px;width:10px;opacity:.5}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile small{display:block;color:var(--muted);font-size:12px}
.tile b{font-family:var(--font-mono);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.tile em{font-style:normal;font-size:12px;color:var(--muted);display:block}
h3{font-size:16px;margin-bottom:8px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.checks li{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.checks li:first-child{border-top:0}
.pill{font-size:12px;font-weight:700;border-radius:6px;padding:2px 0;text-align:center;border:1px solid var(--c);color:var(--c)}
.pill.pass{--c:var(--s2);background:color-mix(in srgb,var(--s2) 12%,var(--surface))}
.pill.fail{--c:var(--s4);background:color-mix(in srgb,var(--s4) 12%,var(--surface))}
.pill.warn{--c:var(--s3);background:color-mix(in srgb,var(--s3) 12%,var(--surface))}
.pill.unk{--c:var(--muted)}
.checks b{display:block;font-weight:500}
.checks span.d{font-size:13px;color:var(--muted)}
.score{font-family:var(--font-mono);font-size:13px;color:var(--muted);font-weight:400}

/* 폼 */
label{display:block;font-weight:500;margin:12px 0 4px;font-size:14px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:200px;font-family:var(--font-mono);font-size:12.5px;line-height:1.4}
.note{font-size:13px;color:var(--muted);margin:6px 0}
.err{color:var(--s4);font-size:14px;margin:10px 0;font-weight:500}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calcout{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}
.calcout .num{font-weight:500}
.rules h3{margin-top:4px}
.rules p,.rules li{font-size:14px}
.rules ul{padding-left:18px;margin:6px 0}
.stgrid{display:grid;gap:8px;margin:8px 0 14px}
.stgrid div{border-left:5px solid var(--c);padding:6px 10px;background:var(--bg);border-radius:6px}
.stgrid b{font-family:var(--font-display)}
table.p{width:100%;border-collapse:collapse;font-size:13.5px}
table.p td{padding:6px 4px;border-top:1px solid var(--line)}
table.p td:last-child{text-align:right;font-family:var(--font-mono)}
.foot{font-size:12px;color:var(--muted);margin-top:18px}
details summary{cursor:pointer;font-weight:500;min-height:36px;display:flex;align-items:center}
.back{margin-bottom:12px}
@media (prefers-reduced-motion:no-preference){.row{transition:border-color .15s}}
@media (max-width:420px){.hero .big{font-size:46px}.top h1{font-size:21px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
//#PURE-START
/* ===== 순수 로직 (DOM 없음) ===== */
const DAY=86400000;
function sma(arr,n){const out=new Array(arr.length).fill(null);let s=0;for(let i=0;i<arr.length;i++){s+=arr[i];if(i>=n)s-=arr[i-n];if(i>=n-1)out[i]=s/n;}return out;}
function parseNum(s){if(s==null)return NaN;const t=String(s).replace(/[,\s"'원$%]/g,'');if(t===''||t==='-')return NaN;return parseFloat(t);}
function parseDate(s){
  s=String(s).trim().replace(/^"|"$/g,'');
  let m=s.match(/^(\d{4})\D?(\d{1,2})\D?(\d{1,2})/);
  if(m){const ts=Date.UTC(+m[1],+m[2]-1,+m[3]);return isNaN(ts)||+m[2]>12||+m[3]>31?NaN:ts;}
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m){const ts=Date.UTC(+m[3],+m[1]-1,+m[2]);return isNaN(ts)||+m[1]>12?NaN:ts;}
  return NaN;
}
function weekKey(ts){const day=new Date(ts).getUTCDay();return ts-((day+6)%7)*DAY;}
function fmtDate(ts){return new Date(ts).toISOString().slice(0,10);}
function splitLine(line,delim){
  if(delim==='ws')return line.split(/\s+/);
  const out=[];let cur='',q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(ch==='"'){q=!q;continue;}
    if(ch===delim&&!q){out.push(cur);cur='';continue;}
    cur+=ch;}
  out.push(cur);return out.map(x=>x.trim());
}
function parseInput(text){
  const lines=String(text).replace(/\r/g,'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(lines.length<2)throw new Error('데이터가 너무 적습니다. 날짜와 종가가 있는 표를 붙여넣어 주세요.');
  const f0=lines[0];
  const delim=f0.includes('\t')?'\t':f0.includes(';')?';':f0.includes(',')?',':'ws';
  const first=splitLine(f0,delim);
  const hasHeader=!first.some(x=>!isNaN(parseDate(x)));
  let iD=-1,iC=-1,iV=-1,iH=-1,iL=-1,start=0;
  if(hasHeader){
    start=1;
    const hd=first.map(x=>x.toLowerCase());
    iD=hd.findIndex(x=>/date|날짜|일자|일시|time/.test(x));
    iC=hd.findIndex(x=>x==='close'||x==='종가'||x==='현재가'||x==='종가(원)');
    if(iC<0)iC=hd.findIndex(x=>/adj/.test(x)&&/close/.test(x));
    if(iC<0)iC=hd.findIndex(x=>/close|종가/.test(x));
    iV=hd.findIndex(x=>/volume|거래량|vol\b/.test(x));
    iH=hd.findIndex(x=>/^high|고가/.test(x));
    iL=hd.findIndex(x=>/^low|저가/.test(x));
    if(iD<0)iD=0;
    if(iC<0)throw new Error('종가(Close) 열을 찾지 못했습니다. 첫 줄에 "날짜, 종가, 거래량" 같은 제목이 있어야 합니다.');
  }else{
    iD=first.findIndex(x=>!isNaN(parseDate(x)));
    const k=first.length-iD-1;
    const rel=({1:{c:1},2:{c:1,v:2},3:{c:1,v:2},4:{h:2,l:3,c:4},5:{h:2,l:3,c:4,v:5}})[k];
    if(!rel)throw new Error('열 구성을 알 수 없습니다. 첫 줄에 제목(날짜, 종가, 거래량 등)을 넣어 주세요.');
    iC=iD+rel.c;iV=rel.v!=null?iD+rel.v:-1;iH=rel.h!=null?iD+rel.h:-1;iL=rel.l!=null?iD+rel.l:-1;
    if(k===4){iC=iD+4;iH=iD+2;iL=iD+3;iV=-1;}
  }
  const raw=[];
  for(let i=start;i<lines.length;i++){
    const f=splitLine(lines[i],delim);
    const ts=parseDate(f[iD]);const c=parseNum(f[iC]);
    if(isNaN(ts)||isNaN(c)||c<=0)continue;
    const v=iV>=0?parseNum(f[iV]):0;
    let h=iH>=0?parseNum(f[iH]):NaN;let l=iL>=0?parseNum(f[iL]):NaN;
    raw.push({ts,c,v:isNaN(v)?0:v,h:isNaN(h)?c:h,l:isNaN(l)?c:l});
  }
  if(raw.length<10)throw new Error('읽은 행이 '+raw.length+'개뿐입니다. 날짜 형식(예: 2026-11-13)과 종가 열을 확인해 주세요.');
  raw.sort((a,b)=>a.ts-b.ts);
  const gaps=[];for(let i=1;i<raw.length;i++)gaps.push((raw[i].ts-raw[i-1].ts)/DAY);
  gaps.sort((a,b)=>a-b);
  if(gaps[Math.floor(gaps.length/2)]>10)throw new Error('월봉처럼 간격이 긴 데이터입니다. 일봉 또는 주봉을 붙여넣어 주세요.');
  const map=new Map();
  for(const r of raw){
    const k=weekKey(r.ts);const w=map.get(k);
    if(!w)map.set(k,{d:k,h:r.h,l:r.l,c:r.c,v:r.v,_t:r.ts});
    else{w.h=Math.max(w.h,r.h);w.l=Math.min(w.l,r.l);if(r.ts>=w._t){w.c=r.c;w._t=r.ts;}w.v+=r.v;}
  }
  const rows=[...map.values()].sort((a,b)=>a.d-b.d).map(({d,h,l,c,v})=>({d,h,l,c,v}));
  if(rows.length<40)throw new Error('주봉으로 '+rows.length+'주치입니다. 30주 이동평균과 기울기를 보려면 최소 40주, 권장 60주 이상이 필요합니다.');
  return rows;
}

const FLAT=1.5, EXT_OK=15, EXT_HOT=30, BRK_MIN=1.02, VOL_X=2;
function analyze(rows,bench,mktStage){
  const n=rows.length;
  if(n<40)return{err:'주봉 40개 이상이 필요합니다.'};
  const c=rows.map(r=>r.c),v=rows.map(r=>r.v),lo=rows.map(r=>r.l||r.c);
  const ma=sma(c,30);
  const hasVol=v.filter(x=>x>0).length>n*0.5;
  const brk=new Array(n).fill(null),fresh=new Array(n).fill(false);
  for(let i=26;i<n;i++){
    let hi=-Infinity;for(let j=i-26;j<i;j++)if(c[j]>hi)hi=c[j];
    if(c[i]>hi*BRK_MIN){let s=0,k=0;for(let j=Math.max(0,i-4);j<i;j++){s+=v[j];k++;}
      const av=k?s/k:0;brk[i]={hi,vr:(hasVol&&av>0)?v[i]/av:null};}
  }
  for(let i=0;i<n;i++){if(!brk[i])continue;let p=false;for(let j=Math.max(0,i-8);j<i;j++)if(brk[j]){p=true;break;}fresh[i]=!p;}
  function stageAt(i){
    if(i<39||ma[i]==null||ma[i-10]==null)return null;
    const s10=(ma[i]/ma[i-10]-1)*100,above=c[i]>ma[i];
    const prior=(ma[i]/ma[Math.max(29,i-40)]-1)*100;
    let rf=false;for(let j=Math.max(0,i-6);j<=i;j++)if(fresh[j]){rf=true;break;}
    if(above&&s10>FLAT)return 2;
    if(!above&&s10<-FLAT)return 4;
    if(above&&s10<-FLAT)return rf?1:4;
    if(above)return rf?2:(prior>5?3:1);
    if(s10>FLAT)return 3;
    return prior>5?3:1;
  }
  const stages=c.map((_,i)=>stageAt(i));
  const last=n-1,stage=stages[last];
  const s10=(ma[last]/ma[last-10]-1)*100,s4=(ma[last]/ma[last-4]-1)*100;
  const ext=(c[last]/ma[last]-1)*100;
  let weeksAbove=0;for(let i=last;i>=0&&ma[i]!=null&&c[i]>ma[i];i--)weeksAbove++;
  let hi52=-Infinity;for(let j=Math.max(0,last-52);j<last;j++)if(c[j]>hi52)hi52=c[j];
  const distHi=(hi52/c[last]-1)*100;
  let bo=null;for(let j=last;j>=Math.max(0,last-8);j--)if(fresh[j]){bo={weeksAgo:last-j,vr:brk[j].vr,hi:brk[j].hi,idx:j};break;}
  const lowRecent=Math.min(...lo.slice(last-9));
  const cands=[ma[last],lowRecent].filter(x=>x<c[last]);
  const stop=cands.length?Math.max(...cands):c[last]*0.92;
  const stopRef=stop===ma[last]?'30주선':(cands.length?'최근 10주 저점':'−8%');
  const riskPct=(c[last]-stop)/c[last]*100;
  let volTrend=null;
  if(hasVol){const a=v.slice(last-3).reduce((x,y)=>x+y,0)/4;const b=v.slice(last-29,last-3).reduce((x,y)=>x+y,0)/26;volTrend=b>0?a/b:null;}
  let rsArr=new Array(n).fill(null),rsNow=null,rsUp=null;
  if(bench){
    const bm=new Map(bench.map(r=>[r.d,r.c]));const ser=[];
    rows.forEach((r,i)=>{const b=bm.get(r.d);if(b)ser.push({i,v:r.c/b});});
    if(ser.length>=32){
      const vals=ser.map(s=>s.v),win=Math.min(52,Math.max(26,Math.floor(ser.length*0.8))),m=sma(vals,win);
      ser.forEach((s,k)=>{if(m[k]!=null)rsArr[s.i]=(vals[k]/m[k]-1)*10;});
      const idxs=rsArr.map((x,i)=>x!=null?i:-1).filter(i=>i>=0);
      if(idxs.length){rsNow=rsArr[idxs[idxs.length-1]];const pi=idxs[Math.max(0,idxs.length-5)];rsUp=rsNow>rsArr[pi];}
    }
  }
  const volOk=bo&&bo.vr!=null&&bo.vr>=VOL_X;
  const boLive=bo&&bo.weeksAgo<=4&&c[last]>bo.hi;
  const checks=[];
  const add=(k,label,st,detail)=>checks.push({k,label,st,detail});
  add('st','종목이 2단계인가',stage===2?'pass':'fail','현재 '+stage+'단계');
  add('sl','30주선이 우상향인가',s10>0?'pass':'fail','최근 10주 기울기 '+(s10>=0?'+':'')+s10.toFixed(1)+'%');
  add('bo','최근 4주 안에 저항선을 돌파했나',boLive?'pass':'fail',
    bo?(boLive?bo.weeksAgo+'주 전 돌파, 아직 저항선 위':'돌파는 있었지만 저항선 아래로 되돌림'):'최근 8주 안에 신규 돌파 없음');
  add('vol','돌파 때 거래량이 평균의 2배 이상인가',!hasVol?'unk':(volOk?'pass':(bo?'fail':'unk')),
    !hasVol?'거래량 데이터 없음':(bo&&bo.vr!=null?'돌파 주 거래량 평균 대비 '+bo.vr.toFixed(1)+'배':'비교할 돌파 없음'));

      sig={k:'watch',t:'돌파했으나 조건 미충족',d:'미충족: '+(miss.join(', ')||'일부 조건')+'. 조건이 갖춰질 때까지 기다리거나 비중을 줄여 접근합니다.'};
    }

    else sig={k:'hold',t:'보유',d:'상승이 진행 중입니다. 30주선을 지키는 동안 보유하고, 신규 매수는 돌파·눌림 신호를 기다립니다.'};

    else sig={k:'wait',t:'관망',d:'아직 횡보 구간입니다. 사지 않고 돌파를 기다립니다.'};
  }else if(stage===3){

      :{k:'reduce',t:'비중 축소 · 이익 확정',d:'상승이 멈추고 30주선이 평평해졌습니다. 신규 매수는 하지 않고 이익을 확정할 준비를 합니다.'};
  }else sig={k:'avoid',t:'매수 금지',d:'30주선 아래에서 하락 중입니다. 싸 보여도 사지 않고, 보유 중이라면 정리를 검토합니다.'};
  return{n,last,price:c[last],date:rows[last].d,ma,maNow:ma[last],stages,stage,s10,s4,ext,weeksAbove,hi52,distHi,bo,fresh,brk,
    stop,stopRef,riskPct,volTrend,hasVol,rsArr,rsNow,rsUp,checks,score,sig,mktStage};
}

/* 예시 데이터 */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gauss(r){return Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(2*Math.PI*r());}
function genSeries(seed,segs,endTs){
  const r=rng(seed),total=segs.reduce((a,s)=>a+s.n,0),rows=[];let price=segs[0].from,idx=0;
  for(const s of segs){const start=price;
    for(let k=0;k<s.n;k++){
      const base=start+(s.to-start)*((k+1)/s.n)+(s.amp||0)*Math.sin(idx*0.45+seed);
      const c=Math.round(base*(1+gauss(r)*(s.noise||0))*100)/100;
      let v=s.vb*(1+gauss(r)*0.22);v=Math.max(v,s.vb*0.4);if(s.vm&&k===s.n-1)v*=s.vm;
      rows.push({d:endTs-(total-1-idx)*7*DAY,h:Math.round(c*(1.004+r()*0.025)*100)/100,l:Math.round(c*(0.996-r()*0.025)*100)/100,c,v:Math.round(v)});
      idx++;}
    price=s.to;}
  return rows;
}
function exampleSet(){
  const end=Date.UTC(2026,10,9);
  return{
    market:{name:'예시 시장지수',ex:true,rows:genSeries(7,[{from:100,n:30,to:92,amp:2,noise:.008,vb:1e8},{n:40,to:100,amp:2,noise:.008,vb:1e8},{n:60,to:135,amp:3,noise:.008,vb:1.1e8}],end)},
    stocks:[
      {name:'예시 A · 돌파 직후',rows:genSeries(11,[{from:130,n:35,to:90,amp:2,noise:.012,vb:1.4e6},{n:90,to:98,amp:5,noise:.012,vb:.9e6},{n:1,to:108,noise:0,vb:.9e6,vm:3.4},{n:4,to:113,noise:.006,vb:1.5e6}],end)},
      {name:'예시 B · 하락 중',rows:genSeries(23,[{from:100,n:25,to:104,amp:3,noise:.01,vb:1e6},{n:105,to:45,amp:3,noise:.015,vb:1.2e6}],end)},
      {name:'예시 C · 천장권',rows:genSeries(31,[{from:50,n:85,to:150,amp:3,noise:.012,vb:1e6},{n:45,to:150,amp:6,noise:.012,vb:1.5e6}],end)},
      {name:'예시 D · 바닥 다지기',rows:genSeries(41,[{from:120,n:70,to:55,amp:2,noise:.014,vb:1e6},{n:60,to:57,amp:3,noise:.012,vb:.7e6}],end)},
      {name:'예시 E · 과열 상승',rows:genSeries(53,[{from:60,n:40,to:62,amp:3,noise:.01,vb:1e6},{n:65,to:100,amp:3,noise:.012,vb:1.2e6},{n:25,to:190,amp:2,noise:.012,vb:1.6e6}],end)}
    ].map(s=>Object.assign(s,{ex:true}))
  };
}

  return `<table class="p"><tr><td>1회 허용 손실액</td><td>${Math.round(cap*rk/100).toLocaleString('ko-KR')}</td></tr>
    <tr><td>주당 손실폭 (현재가 − 손절가)</td><td>${fmtP(per)}</td></tr>
    <tr><td>매수 가능 수량</td><td>${qty.toLocaleString('ko-KR')}주</td></tr>
    <tr><td>투입 금액 (자금 대비)</td><td>${Math.round(amt).toLocaleString('ko-KR')} (${(amt/cap*100).toFixed(0)}%)</td></tr></table>
    ${amt>cap?'<p class="note">계산된 금액이 자금보다 큽니다. 자금 한도 안에서 수량을 줄이세요.</p>':''}`;
}
function detailHTML(id){
  const s=state.stocks.find(x=>x.id===id),A=cache.list[id];
  if(!s){state.sel=null;return listHTML();}
  const back=`<button class="btn small back" data-act="back">← 목록</button>`;
  if(!A||A.err)return back+`<div class="card"><h3>${esc(s.name)}</h3><p class="err">${esc(A?A.err:'분석할 수 없습니다.')}</p></div>`;
  view={rows:s.rows,A};
  return back+heroHTML(s.name,A,false)+chartHTML(A,true)+tilesHTML(A)+checksHTML(A)+
    `<div class="card"><h3>매수 수량 계산</h3><p class="note">손절 기준가에서 정확히 손절될 때 잃는 금액을 자금의 일정 비율로 제한합니다.</p>
    <div class="calc"><div><label for="cap">총 투자자금</label><input type="text" id="cap" inputmode="numeric" value="${state.settings.capital.toLocaleString('ko-KR')}"></div>
    <div><label for="risk">1회 허용 손실 (%)</label><input type="text" id="risk" inputmode="decimal" value="${state.settings.riskPct}"></div></div>
    <div class="calcout" id="calc-out">${calcHTML(A)}</div></div>
    <div class="bar"><button class="btn" data-act="edit" data-id="${s.id}">데이터 갱신</button><button class="btn danger" data-act="delete" data-id="${s.id}">삭제</button></div>`;
}
function marketHTML(){
  const m=state.market,A=cache.mkt;
  if(!m)return `<div class="card"><h3>시장 지수를 등록하세요</h3><p class="note">코스피, 코스닥, S&amp;P 500 같은 지수의 일봉 또는 주봉을 붙여넣으면 시장 단계를 판정하고, 종목의 상대강도와 매수 체크리스트에 반영합니다.</p></div>
    <div class="bar"><button class="btn primary" data-act="add-market">시장 지수 등록</button><button class="btn" data-act="load-ex">예시 불러오기</button></div>`;
  if(!A||A.err)return `<div class="card"><p class="err">${esc(A?A.err:'분석 실패')}</p></div><div class="bar"><button class="btn" data-act="add-market">다시 등록</button></div>`;
  view={rows:m.rows,A};
  return heroHTML(m.name,A,true)+chartHTML(A,false)+
    `<div class="tiles">
      <div class="tile"><small>현재가</small><b>${fmtP(A.price)}</b><em>${fmtDate(A.date)} 주</em></div>
      <div class="tile"><small>30주선 대비</small><b>${fmtPct(A.ext)}</b><em>30주선 ${fmtP(A.maNow)}</em></div>
      <div class="tile"><small>30주선 기울기(10주)</small><b>${fmtPct(A.s10)}</b><em>${A.s10>1.5?'우상향':A.s10<-1.5?'우하향':'평평'}</em></div>
      <div class="tile"><small>52주 고점 대비</small><b>${A.distHi<=0?'신고가권':'-'+(A.distHi/(1+A.distHi/100)).toFixed(1)+'%'}</b></div></div>
    <div class="bar"><button class="btn" data-act="add-market">지수 데이터 갱신</button><button class="btn danger" data-act="del-market">지수 삭제</button></div>`;
}
function formHTML(){
  const f=state.form,isM=f.mode==='market';
  const cur=f.id?state.stocks.find(x=>x.id===f.id):(isM?state.market:null);
  return `<div class="card"><h3>${isM?'시장 지수':'종목'} ${cur?'데이터 갱신':'추가'}</h3>
    <label for="f-name">${isM?'지수 이름':'종목명'}</label><input type="text" id="f-name" value="${esc(cur?cur.name:'')}" placeholder="${isM?'예: 코스피':'예: 삼성전자'}">
    <label for="f-data">가격 데이터 붙여넣기</label>
    <textarea id="f-data" placeholder="날짜,종가,거래량&#10;2026-11-13,58300,12000000&#10;2026-11-12,57900,9800000&#10;..."></textarea>
    <label for="f-file">또는 파일 선택 (CSV, TXT)</label><input type="file" id="f-file" accept=".csv,.txt,.tsv,text/plain,text/csv">
    <p class="note">필요한 열은 날짜와 종가입니다. 거래량이 있으면 돌파 확인에 쓰고, 고가·저가가 있으면 손절 기준에 반영합니다. 일봉은 주봉으로 자동 변환되고, 최소 40주 권장 60주 이상이 필요합니다. 최신순·과거순 모두 가능합니다.</p>
    ${cur?'<p class="note">새 데이터를 붙여넣으면 기존 데이터를 대체합니다.</p>':''}
    ${formErr?`<p class="err">${esc(formErr)}</p>`:''}
    <div class="bar" style="margin-top:12px"><button class="btn primary" data-act="save-form">저장하고 분석</button><button class="btn" data-act="cancel-form">취소</button></div></div>`;
}
function rulesHTML(){
  return `<div class="card rules"><h3>네 단계</h3><div class="stgrid">
    ${[1,2,3,4].map(k=>`<div class="s${k}"><b>${STAGE[k].n} · ${STAGE[k].name}</b><br>${STAGE[k].desc}</div>`).join('')}</div>
    <h3>매수는 2단계 초입에서만</h3><ul>
      <li>1단계 횡보의 저항선을 거래량이 크게 늘면서 넘어서는 순간이 진입 구간입니다.</li>
      <li>돌파 뒤 30주선이 평평해지거나 오르기 시작하는지 확인합니다.</li>
      <li>시장보다 강한 종목(상대강도 양수)이고, 위쪽에 매물이 적을수록 유리합니다.</li>
      <li>시장 지수가 하락 단계이면 좋은 종목도 함께 밀리기 쉬우므로 신규 매수를 줄입니다.</li></ul>
    <h3>매도와 손절</h3><ul>
      <li>3단계에 들어서면 이익을 확정하고, 4단계 종목은 보유하지 않습니다.</li>
      <li>매수 전에 손절 기준가를 정합니다. 이 앱은 30주선과 최근 10주 저점 중 현재가 아래의 더 높은 값을 제시합니다.</li></ul>
    <h3>이 앱의 판정 기준</h3>
    <table class="p"><tr><td>30주선 기울기가 평평하다고 보는 범위 (10주)</td><td>±${FLAT}%</td></tr>
      <tr><td>저항선 돌파 인정 (직전 26주 최고 종가 대비)</td><td>+${((BRK_MIN-1)*100).toFixed(0)}% 이상</td></tr>
      <tr><td>돌파 거래량 기준 (직전 4주 평균 대비)</td><td>${VOL_X}배 이상</td></tr>
      <tr><td>30주선 이격이 적정</td><td>${EXT_OK}% 이내</td></tr>
      <tr><td>과열로 보는 이격</td><td>${EXT_HOT}% 초과</td></tr>
      <tr><td>상대강도</td><td>종목/지수 비율의 52주 평균 대비</td></tr></table>
    <p class="note">위 숫자는 이 앱이 정한 기준값이며, 책의 규칙을 기계적으로 옮긴 것입니다. 판정이 차트의 인상과 다르면 차트를 우선해서 판단하세요.</p></div>`;
}

/* ---------- 렌더 ---------- */
function render(){
  view=null;hoverI=null;
  let body;
  if(state.form)body=formHTML();
  else if(state.tab==='stocks')body=state.sel?detailHTML(state.sel):listHTML();
  else if(state.tab==='market')body=marketHTML();
  else body=rulesHTML();
  $('#app').innerHTML=headerHTML()+tabsHTML()+body;
  drawAll();
}

/* ---------- 차트 ---------- */
const NV=130;
function tok(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function setup(cv){const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);return{g,W,H};}
function drawMain(){
  const cv=$('#c-main');if(!cv||!view)return;
  const {rows,A}=view,{g,W,H}=setup(cv);
  const N=Math.min(rows.length,NV),off=rows.length-N;
  const padL=6,padR=54,padT=10,padB=20,volH=H*0.2,gap=6;
  const plotW=W-padL-padR,plotH=H-padT-padB-volH-gap,step=plotW/N;
  let mn=Infinity,mx=-Infinity;
  for(let i=0;i<N;i++){const k=off+i;mn=Math.min(mn,rows[k].c,A.ma[k]??Infinity);mx=Math.max(mx,rows[k].c,A.ma[k]??-Infinity);}
  const pad=(mx-mn)*0.06||1;mn-=pad;mx+=pad;
  const X=i=>padL+(i+0.5)*step,Y=p=>padT+(1-(p-mn)/(mx-mn))*plotH;
  const ink=tok('--ink'),muted=tok('--muted'),line=tok('--line'),ma=tok('--ma');
  const sc={1:tok('--s1'),2:tok('--s2'),3:tok('--s3'),4:tok('--s4')};
  g.clearRect(0,0,W,H);
  for(let i=0;i<N;i++){const s=A.stages[off+i];if(!s)continue;g.globalAlpha=0.13;g.fillStyle=sc[s];g.fillRect(padL+i*step,padT,step+0.5,plotH+gap+volH);}
  g.globalAlpha=1;
  g.font='11px '+tok('--font-mono');g.textBaseline='middle';g.fillStyle=muted;g.strokeStyle=line;g.lineWidth=1;
  for(let t=0;t<=4;t++){const p=mn+(mx-mn)*t/4,y=Y(p);g.beginPath();g.moveTo(padL,y);g.lineTo(W-padR,y);g.stroke();g.fillText(fmtP(p),W-padR+4,y);}
  let mv=0;for(let i=0;i<N;i++)mv=Math.max(mv,rows[off+i].v);
  const vb=H-padB;
  if(mv>0)for(let i=0;i<N;i++){const k=off+i,h=rows[k].v/mv*volH,isb=A.fresh[k];g.globalAlpha=isb?0.9:0.35;g.fillStyle=isb?sc[2]:muted;g.fillRect(padL+i*step+step*0.15,vb-h,step*0.7,h);}
  g.globalAlpha=1;
  g.lineJoin='round';g.lineWidth=1.8;g.strokeStyle=ma;g.beginPath();let st=false;
  for(let i=0;i<N;i++){const m=A.ma[off+i];if(m==null)continue;if(!st){g.moveTo(X(i),Y(m));st=true;}else g.lineTo(X(i),Y(m));}g.stroke();
  g.lineWidth=1.6;g.strokeStyle=ink;g.beginPath();
  for(let i=0;i<N;i++){const y=Y(rows[off+i].c);i?g.lineTo(X(i),y):g.moveTo(X(i),y);}g.stroke();
  g.fillStyle=sc[2];
  for(let i=0;i<N;i++){if(!A.fresh[off+i])continue;const x=X(i),y=Y(rows[off+i].c)+9;g.beginPath();g.moveTo(x,y-6);g.lineTo(x-5,y+3);g.lineTo(x+5,y+3);g.closePath();g.fill();}
  const ly=Y(rows[rows.length-1].c);g.fillStyle=ink;g.beginPath();g.arc(X(N-1),ly,3.2,0,7);g.fill();
  g.fillStyle=muted;g.textBaseline='alphabetic';g.textAlign='center';
  for(let t=0;t<4;t++){const i=Math.round((N-1)*t/3),d=new Date(rows[off+i].d);g.fillText(d.getUTCFullYear()+'.'+String(d.getUTCMonth()+1).padStart(2,'0'),Math.min(Math.max(X(i),26),W-padR-10),H-5);}
  g.textAlign='left';
  if(hoverI!=null){const x=X(hoverI),k=off+hoverI;g.strokeStyle=muted;g.setLineDash([3,3]);g.beginPath();g.moveTo(x,padT);g.lineTo(x,vb);g.stroke();g.setLineDash([]);
    g.fillStyle=ink;g.beginPath();g.arc(x,Y(rows[k].c),3.5,0,7);g.fill();
    const tip=$('#tip');if(tip){const r=rows[k];tip.style.display='block';tip.textContent=fmtDate(r.d)+'  종가 '+fmtP(r.c)+(A.ma[k]?'  30주선 '+fmtP(A.ma[k]):'')+(r.v?'  거래량 '+Math.round(r.v).toLocaleString('ko-KR'):'')+(A.stages[k]?'  '+A.stages[k]+'단계':'');}}
  else{const tip=$('#tip');if(tip)tip.style.display='none';}
}
function drawRS(){
  const cv=$('#c-rs');if(!cv||!view)return;
  const {rows,A}=view,{g,W,H}=setup(cv),N=Math.min(rows.length,NV),off=rows.length-N;
  const padL=6,padR=54,padT=8,padB=8,plotW=W-padL-padR,plotH=H-padT-padB,step=plotW/N;
  let mn=0,mx=0;for(let i=0;i<N;i++){const v=A.rsArr[off+i];if(v!=null){mn=Math.min(mn,v);mx=Math.max(mx,v);}}
  const pad=(mx-mn)*0.1||0.5;mn-=pad;mx+=pad;
  const X=i=>padL+(i+0.5)*step,Y=v=>padT+(1-(v-mn)/(mx-mn))*plotH;
  const line=tok('--line'),muted=tok('--muted'),acc=tok('--accent');
  g.clearRect(0,0,W,H);g.strokeStyle=muted;g.lineWidth=1;g.setLineDash([4,3]);g.beginPath();g.moveTo(padL,Y(0));g.lineTo(W-padR,Y(0));g.stroke();g.setLineDash([]);
  g.strokeStyle=acc;g.lineWidth=1.8;g.lineJoin='round';g.beginPath();let st=false;
  for(let i=0;i<N;i++){const v=A.rsArr[off+i];if(v==null)continue;if(!st){g.moveTo(X(i),Y(v));st=true;}else g.lineTo(X(i),Y(v));}g.stroke();
  g.font='11px '+tok('--font-mono');g.fillStyle=muted;g.textBaseline='middle';g.fillText('0',W-padR+4,Y(0));
  if(A.rsNow!=null){g.fillStyle=acc;g.fillText((A.rsNow>=0?'+':'')+A.rsNow.toFixed(2),W-padR+4,Y(A.rsNow));}
}
function drawAll(){drawMain();drawRS();bindChart();}
function bindChart(){
  const cv=$('#c-main');if(!cv)return;
  const mv=e=>{const r=cv.getBoundingClientRect(),N=Math.min(view.rows.length,NV),plotW=r.width-60,i=Math.floor((e.clientX-r.left-6)/(plotW/N));hoverI=Math.max(0,Math.min(N-1,i));drawMain();};
  cv.addEventListener('pointermove',mv);cv.addEventListener('pointerdown',mv);
  cv.addEventListener('pointerleave',()=>{hoverI=null;drawMain();});
}

/* ---------- 이벤트 ---------- */
function readFile(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result));fr.onerror=()=>rej(new Error('파일을 읽지 못했습니다.'));fr.readAsText(file);});}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;
  if(act==='tab'){state.tab=id;state.sel=null;state.form=null;formErr='';render();window.scrollTo(0,0);}
  else if(act==='open'){state.sel=id;render();window.scrollTo(0,0);}
  else if(act==='back'){state.sel=null;render();}
  else if(act==='add-stock'){state.form={mode:'stock'};formErr='';render();}
  else if(act==='add-market'){state.form={mode:'market'};formErr='';render();}
  else if(act==='edit'){state.form={mode:'stock',id};formErr='';render();}
  else if(act==='cancel-form'){state.form=null;formErr='';render();}
  else if(act==='save-form'){saveForm();}
  else if(act==='delete'){state.stocks=state.stocks.filter(s=>s.id!==id);state.sel=null;save();recompute();render();}
  else if(act==='del-market'){state.market=null;save();recompute();render();}
  else if(act==='load-ex'){addExamples();render();}
  else if(act==='clear-ex'){state.stocks=state.stocks.filter(s=>!s.ex);if(state.market&&state.market.ex)state.market=null;save();recompute();render();}
  else if(act==='export'){const t=$('#io');t.value=JSON.stringify({v:1,market:state.market,stocks:state.stocks.filter(s=>!s.ex)});ioMsg='';}
  else if(act==='copy-io'){const t=$('#io');t.select();try{navigator.clipboard.writeText(t.value);}catch(err){}}
  else if(act==='import'){
    try{const o=JSON.parse($('#io').value);if(!o||!Array.isArray(o.stocks))throw 0;
      if(o.market)state.market=o.market;o.stocks.forEach(s=>{if(s&&s.name&&Array.isArray(s.rows))state.stocks.push({id:uid(),name:s.name,rows:s.rows,ex:!!s.ex});});
      save();recompute();ioMsg='가져왔습니다.';render();}
    catch(err){ioMsg='백업 텍스트를 읽지 못했습니다.';const d=document.querySelector('details');render();const dd=document.querySelector('details');if(dd)dd.open=true;}
  }
});
async function saveForm(){
  const f=state.form,name=$('#f-name').value.trim();let text=$('#f-data').value;
  const file=$('#f-file').files[0];
  try{
    if(!name)throw new Error('이름을 입력하세요.');
    if(!text.trim()&&file)text=await readFile(file);
    const cur=f.id?state.stocks.find(x=>x.id===f.id):(f.mode==='market'?state.market:null);
    if(!text.trim()){
      if(cur){cur.name=name;cur.ex=false;}else throw new Error('가격 데이터를 붙여넣거나 파일을 선택하세요.');
    }else{
      const rows=parseInput(text);
      if(f.mode==='market')state.market={name,rows};
      else if(f.id){const s=state.stocks.find(x=>x.id===f.id);s.name=name;s.rows=rows;s.ex=false;}
      else state.stocks.push({id:uid(),name,rows});
    }
    save();recompute();state.form=null;formErr='';
    if(f.mode==='market'){state.tab='market';}else{state.tab='stocks';if(!f.id)state.sel=state.stocks[state.stocks.length-1].id;}
    render();window.scrollTo(0,0);
  }catch(err){formErr=err.message||'저장하지 못했습니다.';
    const n=$('#f-name').value,d=$('#f-data').value;render();$('#f-name').value=n;$('#f-data').value=d;}
}
document.addEventListener('input',e=>{
  if(e.target.id==='cap'){const v=parseNum(e.target.value);state.settings.capital=isNaN(v)?0:v;save();if(view)$('#calc-out').innerHTML=calcHTML(view.A);}
  if(e.target.id==='risk'){const v=parseNum(e.target.value);state.settings.riskPct=isNaN(v)?0:v;save();if(view)$('#calc-out').innerHTML=calcHTML(view.A);}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='f-file'&&e.target.files[0]){try{$('#f-data').value=await readFile(e.target.files[0]);}catch(err){formErr=err.message;}}
});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(drawAll,120);});
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>drawAll());}catch(e){}
new MutationObserver(()=>drawAll()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

load();
if(!state.booted&&!state.stocks.length&&!state.market){addExamples();}
recompute();render();
</script>
